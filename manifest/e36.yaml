### Processing graph
- id: download-pack
  kind: ArchiveDownloader
  input:
    url: modpack-uri
- id: picker
  kind: FilePicker
  input:
    files: download-pack
    path: manifest-location
- id: resolve-curse-pack
  kind: CurseResolver
  input:
    manifest: picker
- id: apply-overrides
  kind: ModOverrider
  input:
    mods: resolve-curse-pack
    overrides: overrides
- id: apply-filters
  kind: ModFilter
  input:
    mods: apply-overrides
    filters: excluded-mods
- id: resolve-extra-mods
  kind: ModResolver
  input:
    mods: extra-mods
- id: merge
  kind: ModMerger
  input:
    curse-mods: 'apply-filters::inverse'
    extra-mods: resolve-extra-mods
- id: writer
  kind: ModWriter
  input:
    resolved: 'merge'
- filename: 'e36.json'
  source: 'writer::json'
