[balancing]
	#Battery lifespan multiplier: wear is divided by it (1 = 1.12's wear; Baughn: 25). Wear also
	#doubles every 10 C above 30 C and rises up to 4x as the charge runs low.
	# Default: 25.0
	# Range: 0.01 ~ 10000.0
	batteryLifeFactor = 25.0
	#Heat a fuel gives in the heat furnaces (stone and fuel), times its 1.12 value. Baughn 2026-10-26: with
	#steam turbines working by the expansion, coal to electricity straddles the old 33%: ~24% venting, ~44% with a condenser.
	# Default: 2.5
	# Range: 0.01 ~ 100.0
	heatFurnaceFuelFactor = 2.5
	#The Auto Miner's ore radius, blocks round its shaft, once it is that deep (1.12: 10; Baughn 2026-11-02: 24).
	# Default: 24
	# Range: 1 ~ 64
	autominerRange = 24

[probe]
	#Jade (WAILA) shows every device's full details, not only its headline (sneak to see them anyway).
	#Also 1.12's wailaEasyMode: more detail on some machines.
	details = false

[fire]
	#Seconds a coal fire (the stone heat furnace) takes to follow its setting: a first-order lag (Baughn: coal
	#plants change burn rate slowly).
	# Default: 180.0
	# Range: 0.0 ~ 3600.0
	coalLagSeconds = 180.0
	#The same for an oil burner (the fuel heat furnace).
	# Default: 20.0
	# Range: 0.0 ~ 3600.0
	oilLagSeconds = 20.0
	#Below this share of full power a fire asked to burn lower goes out.
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	minFire = 0.15
	#Seconds to relight a coal fire that went out.
	# Default: 30.0
	# Range: 0.0 ~ 3600.0
	coalKindleSeconds = 30.0
	#Seconds to light an oil burner.
	# Default: 3.0
	# Range: 0.0 ~ 3600.0
	oilLightSeconds = 3.0

[cables]
	#Convert six-node cables to voxel cables as their chunks load (blocks holding only cables; the
	#six-node block is kept inside for /elnlab voxelcables revert). Off until the conversion is approved.
	convertOnLoad = true

[ambient]
	#Ambient temperature (C) deep underground, before the gradient: surface temperatures (25 C per unit of
	#the biome's temperature) blend into it from 4 to 32 blocks under the surface (Baughn 2026-10-26).
	# Default: 15.0
	# Range: -50.0 ~ 200.0
	depthC = 15.0
	#Geothermal gradient: C warmer per block of depth under the surface.
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	depthPerBlock = 0.1
	#Ambient temperature (C) where water evaporates (the Nether).
	# Default: 90.0
	# Range: -50.0 ~ 1000.0
	netherC = 90.0

[bike]
	#The electric bike's top speed on battery, blocks per second (an average horse: 9.5).
	# Default: 9.5
	# Range: 0.5 ~ 40.0
	poweredSpeed = 9.5
	#Its top speed without charge, pedalling, blocks per second (sprinting is 5.6).
	# Default: 6.6
	# Range: 0.5 ~ 40.0
	pedallingSpeed = 6.6
	#Seconds of the rider's input averaged into its speed (Baughn: 2-3, so it feels like a bicycle).
	# Default: 2.5
	# Range: 0.05 ~ 10.0
	inputAverageSeconds = 2.5
	#Its motor's draw at full speed, W (falls with the square of speed; capped by the battery's discharge power).
	# Default: 100.0
	# Range: 0.0 ~ 10000.0
	motorWatts = 100.0
	#Seconds it stays up when stopped with a rider, before it may fall over.
	# Default: 5.0
	# Range: 0.0 ~ 3600.0
	tipOverDelaySeconds = 5.0
	#Chance per second, after that, that it falls over with its rider (0 never).
	# Default: 0.1
	# Range: 0.0 ~ 1.0
	tipOverChancePerSecond = 0.1
	#Running into a full block or a wall faster than this (blocks per second) throws the rider off.
	# Default: 3.0
	# Range: 0.0 ~ 100.0
	crashSpeed = 3.0
	#Height of a full-charge jump, blocks (1.31: one block with room, never 1.5).
	# Default: 1.31
	# Range: 0.0 ~ 5.0
	jumpHeight = 1.31
	#Height it rides up without jumping, blocks (0.6: slabs and stairs; 1 or more climbs full blocks).
	# Default: 0.6
	# Range: 0.0 ~ 2.0
	stepHeight = 0.63
	#How fast it swings round to where the rider looks when slow, degrees per tick.
	# Default: 12.0
	# Range: 0.5 ~ 180.0
	turnRate = 12.0
	#...and at its powered top speed and above (Baughn: steering slows with speed); linear between.
	# Default: 5.0
	# Range: 0.5 ~ 180.0
	turnRateAtTopSpeed = 5.0
	#The front lamp's draw from the trunk battery, W (both bikes; a flashlight's is 20-50).
	# Default: 20.0
	# Range: 0.0 ~ 1000.0
	lampWatts = 20.0
	#The terrain bike: height it rides up without jumping, blocks (1: a whole block; 2-block walls stop it).
	# Default: 1.0
	# Range: 0.0 ~ 2.0
	terrainStepHeight = 1.13
	#The terrain bike: height of a full-charge jump, blocks.
	# Default: 2.5
	# Range: 0.0 ~ 6.0
	terrainJumpHeight = 2.5
	#The terrain bike: its motor's draw at full speed, W (same top speed as the electric bike).
	# Default: 150.0
	# Range: 0.0 ~ 10000.0
	terrainMotorWatts = 150.0

[anvil]
	#The electrical anvil's draw while it welds, W, at 400 V (the high-voltage cable's rating: 5000).
	# Default: 5000.0
	# Range: 10.0 ~ 1000000.0
	power = 5000.0
	#Energy for a unit of repair material's worth of repair (a quarter of the tool), J (40000: 8 s at 5 kW).
	# Default: 40000.0
	# Range: 0.0 ~ 1.0E9
	joulesPerUnit = 40000.0
	#Energy to engrave a new name, J.
	# Default: 2000.0
	# Range: 0.0 ~ 1.0E9
	joulesPerName = 2000.0
	#It starts a pulse when the line is at this share of 400 V...
	# Default: 0.95
	# Range: 0.0 ~ 2.0
	resumeFraction = 0.95
	#...or, when the line has stopped rising for 2 s, at this share or more (a bank on a weak plant levels off
	#below resumeFraction: its leak).
	# Default: 0.93
	# Range: 0.0 ~ 2.0
	plateauFraction = 0.93
	#...and pauses (keeping its progress) when it sags below this share.
	# Default: 0.9
	# Range: 0.0 ~ 2.0
	sagFraction = 0.9
	#A unit's weld comes in this many bursts (Baughn: two, so a capacitor bank can recover between them).
	# Default: 2
	# Range: 1 ~ 100
	burstsPerUnit = 2
	#Seconds of rest between bursts, at least; it also waits for the line to be back at resumeFraction.
	# Default: 3.0
	# Range: 0.0 ~ 600.0
	burstGapSeconds = 3.0

[capacitorBank]
	#Its leakage time constant R C, s (1800: at 400 V it leaks ~130 W, and keeps 2% of its charge after an hour).
	#Batteries are for keeping energy (Baughn); this is for bursts.
	# Default: 1800.0
	# Range: 1.0 ~ 1.0E9
	leakTauSeconds = 1800.0
	#The six-node Power Capacitor's leakage time constant R C, s (1800, as the bank; 1.12 had 120000). With four
	#Dielectrics a sand a row of them was a cheap bulk store (Baughn 2026-10-28: batteries stay the only sensible one).
	# Default: 1800.0
	# Range: 1.0 ~ 1.0E9
	powerCapacitorLeakTauSeconds = 1800.0
	#The capacitor bank's capacitance, F (1.44: one anvil burst from 400 V to 360 V needs 1.32).
	# Default: 1.44
	# Range: 0.001 ~ 100.0
	capacitanceFarads = 1.44
	#Its rating, V: it pops above 1.3 times it, as the Power Capacitor does.
	# Default: 500.0
	# Range: 1.0 ~ 100000.0
	ratingVolts = 500.0

[oilLakes]
	#Generated oil lakes hold this many times the old volume, by going deeper (their footprint is the same).
	#New lakes only: a lake keeps the multiplier it was generated with.
	# Default: 2.0
	# Range: 0.25 ~ 5.0
	sizeMultiplier = 2.0
	#Below this share of its capacity an oil lake seeps instead of running dry.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	tailShare = 0.2
	#A seeping lake yields this share of one 230 V pump's nominal rate, for ever, shared by all the pumps on it.
	# Default: 0.18
	# Range: 0.0 ~ 1.0
	seepShare = 0.18
	#Steam (kg) injected down a well that brings up a bucket of crude from a seeping lake at the pumps' full rate.
	# Default: 0.2
	# Range: 0.001 ~ 100.0
	steamKgPerBucket = 0.2

[introspect]
	#Answer an op's client asking for device reports (eln:describe), for test tools on lab servers.
	#/eln describe works for ops either way.
	remote = false
